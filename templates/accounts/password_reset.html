{% extends 'base.html' %}

{% block title %}Reset Password — SheGlow{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-rose-50 to-cream flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="font-serif text-3xl font-light tracking-widest text-charcoal">She<span class="text-rose-400">Glow</span></a>
      <h1 class="mt-4 text-xl font-medium text-gray-800">Reset your password</h1>
      <p class="text-sm text-gray-500 mt-1">Enter the email address on your account and we'll send a reset link.</p>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-6">
          <label class="block text-xs font-medium text-gray-600 mb-1.5 uppercase tracking-wide">Email Address</label>
          <input type="email" name="email" required autofocus
                 class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-300 text-sm"
                 placeholder="your@email.com" />
        </div>

        <button type="submit"
                class="w-full bg-rose-400 hover:bg-rose-500 text-white font-medium py-3.5 rounded-2xl transition-colors">
          Send Reset Link
        </button>
      </form>

      <div class="mt-5 text-center">
        <a href="{% url 'accounts:login' %}" class="text-sm text-gray-500 hover:text-rose-400 transition-colors">← Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
