{% extends 'base.html' %}

{% block title %}Password Reset Complete — SheGlow{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-rose-50 to-cream flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md text-center">
    <a href="/" class="font-serif text-3xl font-light tracking-widest text-charcoal">She<span class="text-rose-400">Glow</span></a>

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-10 mt-8">
      <div class="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-5">
        <svg class="w-8 h-8 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h1 class="font-serif text-2xl font-light text-gray-800 mb-2">Password updated!</h1>
      <p class="text-sm text-gray-500 mb-6">Your password has been set successfully. You can now log in with your new password.</p>
      <a href="{% url 'accounts:login' %}"
         class="w-full inline-block bg-rose-400 hover:bg-rose-500 text-white font-medium py-3 rounded-2xl transition-colors text-sm">
        Log In
      </a>
    </div>
  </div>
</div>
{% endblock %}
