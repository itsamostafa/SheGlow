{% extends 'base.html' %}

{% block title %}Check Your Email — SheGlow{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-rose-50 to-cream flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md text-center">
    <a href="/" class="font-serif text-3xl font-light tracking-widest text-charcoal">She<span class="text-rose-400">Glow</span></a>

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-10 mt-8">
      <div class="w-16 h-16 bg-rose-50 rounded-full flex items-center justify-center mx-auto mb-5">
        <svg class="w-8 h-8 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 class="font-serif text-2xl font-light text-gray-800 mb-2">Check your email</h1>
      <p class="text-sm text-gray-500 leading-relaxed">
        If an account with that email exists, we've sent a password reset link. Check your inbox (and spam folder).
      </p>
      <a href="{% url 'accounts:login' %}" class="mt-6 inline-block text-sm text-rose-400 hover:text-rose-500 transition-colors">← Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
